# Cloudflare Workers 静态资源项目配置。
# 本项目是纯静态前端：没有 Worker 脚本、没有后端、没有环境变量。
# 所以这里不写 main，只声明 assets 目录，Worker 会在部署时把 dist 作为静态资源上传。
#
# 请求默认走 asset-first：命中静态文件就直接返回，不会唤起任何脚本，
# 因此不消耗 Workers 免费版每天 100,000 次的「调用 Worker 脚本」额度。

name = "msime-skin-studio"
compatibility_date = "2026-10-16"

# Cloudflare 的构建流水线对非默认分支执行的是 `npx wrangler preview`，
# 这条命令要求配置里有 previews 块，缺失会直接报错退出。
# 本项目没有 vars、binding 之类需要给预览单独覆盖的东西，留空即可；
# assets 与 compatibility_date 本就留在顶层，不必挪进来。
# 参考 https://developers.cloudflare.com/workers/previews/configuration/
[previews]

[assets]
directory = "./dist"
# 本项目是单页应用，没有客户端路由，但保留 SPA 兜底：
# 直接访问 /whatever 时返回 index.html 而不是 404，行为更符合静态站点的直觉。
not_found_handling = "single-page-application"
