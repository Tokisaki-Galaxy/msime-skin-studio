name: CI

# 本项目是纯静态前端：没有 Worker 脚本、没有后端、没有 Pages Functions、没有环境变量。
#
# CI 只做质量门禁：跑测试、跑构建。
# 部署交给 Cloudflare 的 Git 集成（在 Cloudflare 后台连上本仓库即可），
# 它会在构建后自行执行 `npx wrangler deploy`，这里不再重复一条部署路径。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支有新的提交进来时，取消还在跑的旧一轮，省得排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      # Node 版本对齐 Cloudflare 构建环境，少一层不确定性。
      - name: 安装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      # 冻结锁文件：CI 上装的版本必须与提交里记录的一致，避免悄悄升级依赖。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 跑测试
        run: pnpm test

      # build 里已经含 tsc，类型错误会在这里失败。
      - name: 构建
        run: pnpm build

      # 用与 Cloudflare 相同的方式试跑一次部署，只做校验不真正上传。
      # 这样 wrangler.toml 写错（比如 assets 目录不存在）会在 PR 上就暴露。
      #
      # wrangler 不在 devDependencies 里：项目运行时只依赖浏览器，没必要为一条门禁往锁文件里
      # 塞一整套 Cloudflare 工具链。Cloudflare 自己的构建环境也是现拉 npx wrangler，这里用
      # dlx 对齐，并把大版本钉住，避免上游 major 升级把 CI 带崩。
      - name: 校验部署配置
        run: pnpm dlx wrangler@4 deploy --dry-run


